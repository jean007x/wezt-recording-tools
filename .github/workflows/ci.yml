name: CI
on:
  push:
  pull_request:

jobs:
  linux:
    name: Linux (${{ matrix.preset }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [release, clang, asan, tsan]
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build clang
      - name: Configure
        run: cmake --preset ${{ matrix.preset }} -G Ninja
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }} -j2

  # Windows and macOS: the whole library and every test build and pass here (WASAPI and CoreAudio themselves cannot run on a runner without sound hardware).
  windows:
    name: Windows (MSVC)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release -j 2
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  macos:
    name: macOS (Apple clang)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j 3
      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The full app with its window (Dear ImGui + GLFW, fetched here). Builds on all three systems; the CPU snapshot is uploaded so the layout can be looked at.
  app:
    name: App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
      - name: Fetch Dear ImGui and GLFW
        shell: bash
        run: |
          git clone --depth 1 --branch v1.91.9 https://github.com/ocornut/imgui.git "$RUNNER_TEMP/imgui"
          git clone --depth 1 --branch 3.4 https://github.com/glfw/glfw.git "$RUNNER_TEMP/glfw"
      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWEZT_BUILD_UI=ON -DWEZT_IMGUI_DIR="$RUNNER_TEMP/imgui" -DWEZT_GLFW_DIR="$RUNNER_TEMP/glfw" -DGLFW_BUILD_WAYLAND=OFF
      - name: Build
        run: cmake --build build --config Release -j 3
      - name: UI test
        run: ctest --test-dir build -C Release -R wezt_ui_test --output-on-failure
      - name: Snapshots
        shell: bash
        run: |
          mkdir -p snapshots
          B=$(find build -name 'wezt_ui_snapshot*' -type f \( -perm -u+x -o -name '*.exe' \) | head -1)
          for v in edit mix sampler assistant pianoroll plugparams; do "$B" snapshots/$v.ppm $v || true; done
          "$B" snapshots/plugdraw.ppm plugdraw 450 480 || true
      - uses: actions/upload-artifact@v4
        with:
          name: snapshots-${{ matrix.os }}
          path: snapshots/
      - uses: actions/upload-artifact@v4
        with:
          name: wezt-studio-${{ matrix.os }}
          path: |
            build/wezt-studio
            build/Release/wezt-studio.exe
          if-no-files-found: warn

  # Real plug-in hosting: the Steinberg VST3 SDK (with its sample plug-ins, built here as test subjects) and the CLAP headers.
  plugins:
    name: Plug-in hosting (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libx11-dev libxcb-util-dev libxcb-cursor-dev libxcb-keysyms1-dev libxcb-xkb-dev libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev libcairo2-dev libgtkmm-3.0-dev libsqlite3-dev
      - name: Fetch the VST3 SDK and CLAP
        shell: bash
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/steinbergmedia/vst3sdk.git "$RUNNER_TEMP/vst3sdk"
          git clone --depth 1 --branch 1.2.3 https://github.com/free-audio/clap.git "$RUNNER_TEMP/clap"
      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWEZT_ENABLE_VST3=ON -DWEZT_VST3_SDK_DIR="$RUNNER_TEMP/vst3sdk" -DSMTG_ENABLE_VST3_PLUGIN_EXAMPLES=ON -DWEZT_ENABLE_CLAP=ON -DWEZT_CLAP_DIR="$RUNNER_TEMP/clap"
      - name: Build
        run: cmake --build build --config Release -j 3
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
