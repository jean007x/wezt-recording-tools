name: Release
# Builds the app and the command-line tools on Windows, macOS and Linux and packs them as downloadable archives.
# Run it by hand (Actions > Release > Run workflow) or push a tag such as v0.8.0, which also publishes a GitHub release.
# The packages are NOT code-signed or notarized: Windows SmartScreen and macOS Gatekeeper will warn until certificates are added.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  package:
    name: Package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl1-mesa-dev
      - name: Fetch Dear ImGui and GLFW
        shell: bash
        run: |
          git clone --depth 1 --branch v1.91.9 https://github.com/ocornut/imgui.git "$RUNNER_TEMP/imgui"
          git clone --depth 1 --branch 3.4 https://github.com/glfw/glfw.git "$RUNNER_TEMP/glfw"
      - name: Build
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DWEZT_BUILD_UI=ON -DWEZT_IMGUI_DIR="$RUNNER_TEMP/imgui" -DWEZT_GLFW_DIR="$RUNNER_TEMP/glfw" -DGLFW_BUILD_WAYLAND=OFF -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          cmake --build build --config Release -j 3 --target wezt-studio wezt-mcp wezt_voice_takes
      - name: Check the binaries (macOS minimum version and architectures, Windows GUI subsystem)
        shell: bash
        run: |
          S=$(find build -type f \( -name wezt-studio -o -name wezt-studio.exe \) | head -1)
          echo "checking $S"
          if [ "${{ runner.os }}" = "macOS" ]; then
            lipo -archs "$S"
            otool -l "$S" | grep -A4 LC_BUILD_VERSION
            lipo -archs "$S" | grep -q arm64 && lipo -archs "$S" | grep -q x86_64
            otool -l "$S" | grep -A4 LC_BUILD_VERSION | grep -q "minos 12.0"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            python3 -c "import struct,sys; d=open(sys.argv[1],'rb').read(); pe=struct.unpack_from('<I',d,0x3c)[0]; sub=struct.unpack_from('<H',d,pe+24+68)[0]; print('PE subsystem', sub, '(2 = GUI, 3 = console)'); sys.exit(0 if sub==2 else 1)" "$S"
          fi
      - name: Pack
        shell: bash
        run: |
          NAME="wezt-recording-tools-${{ runner.os }}"
          mkdir -p "dist/$NAME"
          for t in wezt-studio wezt-mcp wezt_voice_takes; do
            f=$(find build -type f \( -name "$t" -o -name "$t.exe" \) | head -1)
            if [ -n "$f" ]; then cp "$f" "dist/$NAME/"; else echo "missing $t"; exit 1; fi
          done
          cp README.md "dist/$NAME/"; cp -r docs "dist/$NAME/docs"
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then 7z a "$NAME.zip" "$NAME" >/dev/null; else tar czf "$NAME.tar.gz" "$NAME"; fi
          ls -l
      - uses: actions/upload-artifact@v4
        with:
          name: wezt-recording-tools-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  publish:
    name: Publish release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" out/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --notes "Unsigned builds for Windows, macOS and Linux. See the README for what is tested and what is not."
